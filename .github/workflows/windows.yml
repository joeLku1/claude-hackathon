name: Build Windows EXE
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test PDF engine
        run: python -m unittest discover -s tests -v
      - name: Benchmark text editing engine
        run: python benchmarks/editor.py
      - name: Install OCR runtime
        run: choco install tesseract --yes --no-progress
      - name: Test desktop controls before packaging
        env:
          OPENPDF_UI_CAPTURE: '1'
        timeout-minutes: 2
        shell: pwsh
        run: |
          python app.py --self-test
          Get-Content smoke-output.log
          if ($LASTEXITCODE -ne 0) { throw 'Source GUI smoke test failed' }
      - name: Build executable with English OCR
        shell: pwsh
        run: |
          $ocrPath = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$ocrPath\tesseract.exe")) { throw 'Tesseract installation missing' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpenPDF-Studio --collect-all pymupdf --collect-all pdf2docx --collect-submodules fontTools.ttLib.tables --add-data "$ocrPath;tesseract" --add-data "LICENSE;." --add-data "THIRD_PARTY.md;." app.py
      - name: Test packaged executable
        timeout-minutes: 5
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist\OpenPDF-Studio.exe' -ArgumentList '--self-test' -Wait -PassThru
          if (Test-Path smoke-output.log) { Get-Content smoke-output.log }
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-Studio-Windows
          path: dist/OpenPDF-Studio.exe
      - name: Publish downloadable executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Continue the release series at build 11 in this fork. Failed runs
          # do not consume release numbers; later successful builds increment it.
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing release numbers' }
          $buildNumber = 11
          foreach ($release in $releases) {
            if ($release.tagName -match '^build-(\d+)$') {
              $buildNumber = [Math]::Max($buildNumber, [int]$Matches[1] + 1)
            }
          }
          $tag = "build-$buildNumber"
          gh release create $tag dist/OpenPDF-Studio.exe --title "OpenPDF Studio build $buildNumber" --target '${{ github.sha }}' --notes 'PDF interaction fixes: horizontal trackpad scrolling; proportional vertical scrolling using Windows preferences; configurable watermarks including 45-degree full-page and repeated layouts; text and freehand highlight modes; click-again toggle for text-box editing. Existing toolbar layout and styling retained. PDF engine, source GUI, and packaged executable tests must pass before publication. Unsigned Windows executable with English OCR.'
